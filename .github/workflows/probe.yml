name: Head-to-head probe (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/h2h_probe.py
      - name: Save result
        if: ${{ always() }}
        run: |
          git config user.name "fixtures-bot"
          git config user.email "fixtures-bot@users.noreply.github.com"
          git add output/h2h_probe.json
          git commit -m "Head-to-head probe result" && git pull --rebase -X theirs && git push || true
