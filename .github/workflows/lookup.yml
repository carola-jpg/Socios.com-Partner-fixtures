name: TheSportsDB lookup (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/tsdb_lookup.py
      - name: Save result
        if: ${{ always() }}
        run: |
          git config user.name "fixtures-bot"
          git config user.email "fixtures-bot@users.noreply.github.com"
          git add output/tsdb_lookup.txt
          git commit -m "TheSportsDB lookup result" && git push || true
